name: Update Dubai One link
on:
  schedule:
    - cron: '0 */6 * * *' # يشتغل تلقائياً كل 6 ساعات لتجديد الرابط
  workflow_dispatch: # يتيح لك التشغيل يدوياً بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 🟢 الخطوة المضافة لتثبيت المكتبات وحل المشكلة
      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager
          pip install undetected-chromedriver

      - name: Run Python script
        env:
          DUBAI_ACCESS_TOKEN: ${{ secrets.DUBAI_ACCESS_TOKEN }} # يمرر التوكن للسكريبت بأمان
        run: python script.py

      - name: Upload Debug Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_screenshot.png
        continue-on-error: true # لكي لا يتوقف السكريبت لو فشلت الصورة لأي سبب

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dubai_one.m3u
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update Dubai One Link"
            git push origin main
          fi
