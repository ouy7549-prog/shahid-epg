name: Update Stream Link

on:
  schedule:
    - cron: '0 * * * *' # يعمل كل ساعة
  workflow_dispatch: # يسمح لك بتشغيله يدوياً

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install cloudscraper pycryptodome

      - name: Run fetch script
        run: python fetch_link.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          if [ -f live_link.txt ]; then
            git add live_link.txt
            git commit -m "Update Dubai One Link" || echo "No changes"
            git push
          else
            echo "File still not found"
            exit 0 # غيرناها لـ 0 عشان نشوف النتيجة بدون علامة خطأ حمراء
          fi
